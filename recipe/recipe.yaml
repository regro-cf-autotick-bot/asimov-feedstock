schema_version: 1

context:
  version: "0.8.0"

package:
  name: asimov
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asimov/asimov-${{ version }}.tar.gz
  sha256: be71b923d219c9c9b2dc1eb1fcf324aa46cec85efc40384ae005475cc776b524

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - asimov = asimov.olivaw:olivaw
      - locutus = asimov.locutus:cli
      - olivaw = asimov.olivaw:olivaw
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools_scm
  run:
    - click
    - flask
    - git
    - gitpython
    - liquidpy
    - networkx
    - numpy
    - otter-report >=0.3.3
    - pillow >=10.2.0
    - pydantic >=2.0.0
    - python >=${{ python_min }}
    - python-gitlab
    - python-htcondor
    - pytz
    - pyyaml
    - requests
    - setuptools <82.0.0a0
    - tinydb

tests:
  - python:
      imports:
        - asimov
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - git
    script:
      - locutus --help
      - asimov --help
      - olivaw --help

about:
  summary: Parameter Estimation automator for gravitational wave analyses.
  description: |
    Asimov is a python package designed to make organising and monitoring data analysis jobs easier.
  homepage: https://asimov.docs.ligo.org/asimov/
  repository: https://git.ligo.org/asimov/asimov.git
  documentation: https://asimov.docs.ligo.org/asimov/
  license: ISC
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ColmTalbot
    - duncanmmacleod
    - transientlunatic
